name: Render Starting XI Reveal

on:
  workflow_dispatch:
    inputs:
      lineup_file:
        description: "Path to lineup JSON (for example visual/demo-lineup.json)"
        required: true
        default: "visual/demo-lineup.json"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "Pillow>=10.0.0"

      - name: Render animated Starting XI
        env:
          LINEUP_FILE: ${{ inputs.lineup_file }}
        run: |
          test -f "$LINEUP_FILE"
          python scripts/render_starting_xi.py --input "$LINEUP_FILE" --output output/starting-xi-reveal.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: persib-starting-xi-reveal
          path: output/starting-xi-reveal.mp4
          retention-days: 7
