name: "02 - Build Script Draft"

on:
  workflow_dispatch:
    inputs:
      editorial_file:
        description: "Path file editorial, contoh editorial/pending/topik.md"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build draft scaffold
        env:
          EDITORIAL_FILE: ${{ inputs.editorial_file }}
        run: |
          python scripts/build_script_draft.py --input "$EDITORIAL_FILE" --output-dir scripts/drafts
      - name: Commit generated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/drafts/
          if git diff --cached --quiet; then
            echo "No draft changes."
          else
            git commit -m "Generate editorial script draft"
            git push
          fi
