name: Prepare Chibi Expression Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-chibi.txt

      - name: Prepare expression PNGs
        run: python scripts/prepare_chibi_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/chibi/expressions
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "Generate chibi expression PNG assets"
            git push
          fi
